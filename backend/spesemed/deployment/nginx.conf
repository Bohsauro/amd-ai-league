# =============================================================================
# SPESEMED Production nginx.conf (alternative a Caddy)
# =============================================================================
# Stack: nginx 1.24+ davanti a FastAPI uvicorn su 127.0.0.1:8000.
# Installazione: sudo cp deployment/nginx.conf /etc/nginx/sites-available/spesemed
#                 sudo ln -s /etc/nginx/sites-available/spesemed /etc/nginx/sites-enabled/
#                 sudo nginx -t && sudo systemctl reload nginx
#
# Certificati TLS: usa certbot per Let's Encrypt.
#   sudo certbot --nginx -d api.spesemed.it -d www.spesemed.it
#
# SECURITY (audit 2025): vedi SECURITY.md §5 + §6.
# =============================================================================

# Real IP setup (CRITICAL per rate-limit dietro reverse proxy).
# Senza questo blocco, $binary_remote_addr punta sempre all'IP del proxy
# (127.0.0.1 in questo caso), quindi TUTTI i client reali condividono 1
# solo bucket = rate-limit inutile. set_real_ip_from dice a nginx di fidarsi
# dell'header X-Forwarded-For SOLO da IP trusted (qui localhost).
set_real_ip_from 127.0.0.1;
# Aggiungi altri IP trusted se il reverse proxy non e' localhost
# (es.: set_real_ip_from 10.0.0.0/24;)
real_ip_header X-Forwarded-For;

# Rate limit zone (shared memory): 10MB, ~160k IP unici tracciabili.
# Usa $binary_remote_addr che ora e' il REAL client IP (post-set_real_ip_from).
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;

# Upstream FastAPI (multiple workers OK).
upstream spesemed_fastapi {
    server 127.0.0.1:8000;
    keepalive 32;
    # Per multi-worker uvicorn: aggiungi server unix:/tmp/spesemed-1.sock;
}

# HTTP -> HTTPS redirect.
server {
    listen 80;
    listen [::]:80;
    server_name api.spesemed.it www.spesemed.it;

    # ACME challenge (certbot) -- in produzione servono path specifici.
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.spesemed.it;

    # --------------------------------------------------------------
    # TLS settings (Let'sEncrypt certbot-managed)
    # --------------------------------------------------------------
    ssl_certificate /etc/letsencrypt/live/api.spesemed.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.spesemed.it/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # --------------------------------------------------------------
    # Security headers (anti-XSS, anti-clickjacking, HSTS)
    # --------------------------------------------------------------
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;
    # Rimuovi Server header (oscuramento stack info).
    server_tokens off;

    # --------------------------------------------------------------
    # Body size limit (anti-OOM layer aggiuntivo al backend FIX C1)
    # --------------------------------------------------------------
    client_max_body_size 25M;  # 20MB backend + headroom multipart

    # --------------------------------------------------------------
    # /admin/*: IP allowlist + rate-limit
    # --------------------------------------------------------------
    location /admin/ {
        # IMPORTANTE: personalizza con i tuoi IP Ops / VPN.
        # Default: solo localhost (nginx stesso container).
        allow 127.0.0.1;
        # allow 203.0.113.10;  # ESEMPIO - IP Ops statico (sostituisci)
        # allow 203.0.113.11;  # ESEMPIO - VPN subnet (sostituisci)
        deny all;

        # Rate-limit aggiuntivo per X-Admin-Token brute-force.
        limit_req zone=api_limit burst=5 nodelay;

        proxy_pass http://spesemed_fastapi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------------
    # /metrics: IP allowlist (Prometheus scrapers)
    # NB: defense-in-depth — anche il backend FastAPI implementa un IP
    # allowlist applicativo via `metrics_ip_allowlist` (config.py).
    # Questa regola edge e' la protezione PRIMARIA; il filtro in app chiude
    # il gap quando il deployment espone l'API direttamente (es. lab) o
    # il proxy e' misconfigurato (FIX M6 audit 2025, smoke test [E3]).
    # --------------------------------------------------------------
    location = /metrics {
        allow 127.0.0.1;
        # allow 10.0.0.0/24;  # ESEMPIO - Prometheus container subnet
        deny all;

        proxy_pass http://spesemed_fastapi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------------
    # /api/v1/*: proxy standard con rate-limit globale
    # --------------------------------------------------------------
    location /api/v1/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://spesemed_fastapi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout per upload PDF+immagini (default 60s, alzato a 120s).
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # --------------------------------------------------------------
    # Logging JSON per ingestion
    # --------------------------------------------------------------
    access_log /var/log/nginx/spesemed-access.log json;
    error_log /var/log/nginx/spesemed-error.log warn;
}
